# Local stack (BUILD_PROMPT M9): Postgres, the web server and the worker, with health checks.
#   docker compose up                 # works with fakes: a fake GitHub serves acme/reports#77, no credentials needed
#   docker compose run --rm smoke     # sends a signed webhook and waits for the check run and comment
# To use a real GitHub App instead, set in .env: GITHUB_API_URL=https://api.github.com, GITHUB_APP_ID,
# GITHUB_APP_PRIVATE_KEY_FILE and GITHUB_WEBHOOK_SECRET_FILE (mounted secret files), and PUBLIC_URL.
# Provider keys (TYPESAFE_API_KEY, ANTHROPIC_API_KEY) are optional: without them verdicts are uncertain.
x-remit: &remit
  build: .
  image: remit:local
  env_file:
    - path: .env
      required: false
  restart: unless-stopped
  volumes:
    - shared:/shared:ro

x-env: &env
  DATABASE_URL: postgres://remit:remit@postgres:5432/remit
  GITHUB_API_URL: ${GITHUB_API_URL:-http://fake-github:4000}
  GITHUB_APP_ID: ${GITHUB_APP_ID:-1}
  GITHUB_APP_PRIVATE_KEY_FILE: ${GITHUB_APP_PRIVATE_KEY_FILE:-/shared/app-key.pem}
  GITHUB_WEBHOOK_SECRET_FILE: ${GITHUB_WEBHOOK_SECRET_FILE:-/shared/webhook-secret}
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: remit
      POSTGRES_PASSWORD: remit
      POSTGRES_DB: remit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remit -d remit"]
      interval: 5s
      timeout: 3s
      retries: 20

  fake-github:
    image: remit:local
    build: .
    command: ["node", "packages/server/dist/dev/fake-github.js"]
    environment:
      KEY_OUT: /shared/app-key.pem
      GITHUB_APP_ID: "1"
    volumes:
      - shared:/shared
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    <<: *remit
    environment:
      <<: *env
      REMIT_ROLE: web
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      fake-github:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Starts after the server is healthy: the server runs the database migrations.
  worker:
    <<: *remit
    environment:
      <<: *env
      REMIT_ROLE: worker
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  smoke:
    profiles: ["smoke"]
    image: remit:local
    command: ["node", "packages/server/dist/dev/smoke.js"]
    environment:
      REMIT_URL: http://server:3000
      FAKE_GITHUB_URL: http://fake-github:4000
      GITHUB_WEBHOOK_SECRET_FILE: ${GITHUB_WEBHOOK_SECRET_FILE:-/shared/webhook-secret}
    volumes:
      - shared:/shared:ro
    depends_on:
      worker:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  shared:
