packages:
  - "packages/*"

# Dependency build scripts are off by default (pnpm 11). esbuild ships its binary as an optional dependency,
# the tree-sitter grammar packages are used only for their prebuilt .wasm files, and msw needs no postinstall in Node.
allowBuilds:
  esbuild: false
  tree-sitter-typescript: false
  tree-sitter-javascript: false
  tree-sitter-python: false
  tree-sitter-rust: false
  tree-sitter: false
  msw: false

minimumReleaseAgeExclude:
  - pg-boss@12.35.0
